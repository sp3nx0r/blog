baseURL: 'https://www.securimancy.com/'
locale: 'en-us'
title: 'Securimancy'
description: "Security-focused engineering and homelab adventures"
theme: "PaperMod"

enableRobotsTXT: true
enableEmoji: true
enableGitInfo: true

params:
  env: production
  defaultTheme: "auto"
  ShowReadingTime: true
  ShowShareButtons: false
  ShowFontAwesome: true
  ShowToc: false
  TocOpen: false
  UseHugoToc: true
  ShowBreadCrumbs: true
  ShowPostNavLinks: true
  ShowDateOnPost: true
  ShowReadingTimeOnPost: true
  ShowCodeCopyButtons: true
  ShowAllPagesInArchive: false
  description: "Security-focused engineering and homelab adventures"
  author: "Spencer Koch"
  logo: "/images/magic-circle.jpg"

  # Explicitly scope "posts" as the main section (home list, archives, nav).
  mainSections:
    - posts

  # Default social-share image for pages without a cover (e.g. the homepage).
  images:
    - "/android-chrome-512x512.png"

  # Enables twitter:site/creator on Twitter cards.
  social:
    twitter: "sp3nx0r"

  fuseOpts:
    ignoreLocation: true
    isCaseSensitive: false
    shouldSort: true
    keys: ["title", "permalink", "summary", "content"]

  profileMode:
    enabled: true
    title: "Spencer Koch"
    subtitle: "{{< profile-subtitle >}}"
    imageUrl: "images/profile.jpeg"
    imageTitle: "Spencer Koch"
    imageLink: ""

  socialIcons:
    - name: "Reddit"
      url: "https://reddit.com/user/securimancer"
      icon: "fab fa-reddit"
    - name: "Bluesky"
      url: "https://bsky.app/profile/securimancy.com"
      icon: "fab fa-bluesky"
    - name: "Twitter"
      url: "https://twitter.com/sp3nx0r"
      icon: "fab fa-twitter"
    - name: "LinkedIn"
      url: "https://www.linkedin.com/in/spencerwkoch/"
      icon: "fab fa-linkedin"
    - name: "Keybase"
      url: "https://keybase.io/sp3nx0r"
      icon: "fab fa-keybase"
    - name: Github
      url: "https://github.com/sp3nx0r"
      icon: "fab fa-github"

  assets:
    disableHLJS: false

markup:
  highlight:
    style: dracula
    lineNos: true
    lineNumbersInTable: true
    noClasses: false
    codeFences: true
    guessSyntax: true
  goldmark:
    renderer:
      unsafe: true
    parser:
      attribute:
        block: true

frontmatter:
  date: ["date", "publishDate", "lastmod"]
  lastmod: ["lastmod", ":git", "date", "publishDate"]
  publishDate: ["publishDate", "date"]
  expiryDate: ["expiryDate"]

taxonomies:
  tag: "tags"
  category: "categories"

# Taxonomy (tag/category) and term pages are thin content; keep them crawlable
# for internal links but out of the index. PaperMod's head.html emits
# "noindex, nofollow" when robotsNoIndex is set. They are also excluded from
# sitemap.xml (see layouts/sitemap.xml).
cascade:
  - target:
      kind: taxonomy
    robotsNoIndex: true
  - target:
      kind: term
    robotsNoIndex: true

menu:
  main:
    - identifier: "archives"
      name: "Archives"
      url: "/archives/"
      weight: 1
    - identifier: "search"
      name: "Search"
      url: "/search/"
      weight: 2
    - identifier: "about"
      name: "About"
      url: "/about/"
      weight: 3

outputs:
  home:
    - HTML
    - RSS
    - JSON

privacy:
  twitter:
    disabled: true

caches:
  images:
    dir: :cacheDir/images
